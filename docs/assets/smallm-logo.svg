<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">smaLLM causal attention logo</title>
  <desc id="desc">A compact lower-triangular grid of token blocks representing a causal attention mask.</desc>
  <defs>
    <linearGradient id="frame" x1="112" y1="112" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0883e"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="tokens" x1="152" y1="152" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0883e"/>
      <stop offset="0.48" stop-color="#d29922"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="#0d1117"/>
  <rect x="92" y="92" width="328" height="328" rx="54" fill="#161b22" stroke="url(#frame)" stroke-width="12"/>

  <g fill="none" stroke="#484f58" stroke-width="6" opacity="0.55">
    <rect x="206" y="142" width="50" height="50" rx="13"/>
    <rect x="270" y="142" width="50" height="50" rx="13"/>
    <rect x="334" y="142" width="50" height="50" rx="13"/>
    <rect x="270" y="206" width="50" height="50" rx="13"/>
    <rect x="334" y="206" width="50" height="50" rx="13"/>
    <rect x="334" y="270" width="50" height="50" rx="13"/>
  </g>

  <g fill="url(#tokens)">
    <rect x="142" y="142" width="50" height="50" rx="13"/>
    <rect x="142" y="206" width="50" height="50" rx="13"/>
    <rect x="206" y="206" width="50" height="50" rx="13"/>
    <rect x="142" y="270" width="50" height="50" rx="13"/>
    <rect x="206" y="270" width="50" height="50" rx="13"/>
    <rect x="270" y="270" width="50" height="50" rx="13"/>
    <rect x="142" y="334" width="50" height="50" rx="13"/>
    <rect x="206" y="334" width="50" height="50" rx="13"/>
    <rect x="270" y="334" width="50" height="50" rx="13"/>
    <rect x="334" y="334" width="50" height="50" rx="13"/>
  </g>

  <path d="M167 167v64h64v64h64v64h64" fill="none" stroke="#f0f6fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="167" cy="167" r="7" fill="#f0f6fc"/>
  <circle cx="359" cy="359" r="7" fill="#f0f6fc"/>
