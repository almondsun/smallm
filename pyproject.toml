[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallm"
version = "0.2.0"
description = "A small GPT-style language model implemented from scratch in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pip-audit>=2.7",
  "PyYAML>=6.0",
  "pytest-cov>=5.0",
  "pytest>=7.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["smallm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B905", "E501", "RUF007", "RUF043"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]
warn_unreachable = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "yaml"]
follow_imports = "skip"
ignore_missing_imports = true
