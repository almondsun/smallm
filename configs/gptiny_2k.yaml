data:
  input_path: data/raw/input.txt
  prepared_path: data/processed/corpus.txt
  manifest_path: data/processed/corpus_manifest.json
  tokenizer_path: data/processed/tokenizer.json
  block_size: 64
  train_split: 0.9

model:
  # Placeholder default; training replaces this with the tokenizer-derived vocab size.
  vocab_size: 256
  block_size: 64
  n_layer: 2
  n_head: 2
  n_embd: 64
  dropout: 0.1

train:
  run_name: gptiny_2k
  runs_dir: runs
  batch_size: 16
  max_steps: 2000
  learning_rate: 0.0003
  weight_decay: 0.0
  log_interval: 50
  eval_interval: 100
  eval_batches: 5
  sample_prompt: Once
  sample_max_new_tokens: 100
  sample_temperature: 1.0
  sample_top_k: null
  sample_seed: 1337
  sample_greedy: false
  seed: 1337
