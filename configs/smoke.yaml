data:
  input_path: data/raw/input.txt
  prepared_path: data/processed/corpus.txt
  manifest_path: data/processed/corpus_manifest.json
  tokenizer_path: data/processed/tokenizer.json
  block_size: 32
  train_split: 0.9

model:
  # Placeholder default; training replaces this with the tokenizer-derived vocab size.
  vocab_size: 256
  block_size: 32
  n_layer: 1
  n_head: 1
  n_embd: 32
  dropout: 0.1

train:
  run_name: smoke
  runs_dir: runs
  batch_size: 4
  max_steps: 5
  learning_rate: 0.0003
  weight_decay: 0.0
  log_interval: 1
  eval_interval: 5
  eval_batches: 2
  sample_prompt: Once
  sample_max_new_tokens: 100
  sample_temperature: 1.0
  sample_top_k: null
  sample_seed: 1337
  sample_greedy: false
  seed: 1337
