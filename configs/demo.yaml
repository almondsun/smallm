data:
  input_path: examples/demo_corpus.txt
  prepared_path: data/processed/demo_corpus.txt
  manifest_path: data/processed/demo_corpus_manifest.json
  tokenizer_path: data/processed/demo_tokenizer.json
  tokenizer_type: char
  block_size: 32
  train_split: 0.9

model:
  vocab_size: 256
  block_size: 32
  n_layer: 1
  n_head: 1
  n_embd: 32
  dropout: 0.1

train:
  run_name: demo
  runs_dir: runs
  batch_size: 4
  max_steps: 5
  learning_rate: 0.0003
  weight_decay: 0.0
  log_interval: 1
  eval_interval: 5
  eval_batches: null
  sample_prompt: Research
  sample_max_new_tokens: 40
  sample_temperature: 1.0
  sample_top_k: null
  sample_seed: 1337
  sample_greedy: true
  seed: 1337
