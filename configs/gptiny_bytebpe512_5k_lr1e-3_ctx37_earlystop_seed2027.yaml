  manifest_path: data/processed/corpus_manifest.json
  tokenizer_path: data/processed/tokenizer_bytebpe512.json
  tokenizer_type: byte_bpe
  bpe_vocab_size: 512
  bpe_min_frequency: 2
  block_size: 37
  train_split: 0.9

model:
  vocab_size: 512
  block_size: 37
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1

train:
  run_name: gptiny_bytebpe512_5k_lr1e-3_ctx37_earlystop_seed2027
  runs_dir: runs
  batch_size: 27
  max_steps: 5000
  learning_rate: 0.001
  weight_decay: 0.0
  log_interval: 100
  eval_interval: 250
  eval_batches: null
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0
  sample_prompt: Once
  sample_max_new_tokens: 100
  sample_temperature: 1.0
  sample_top_k: null
  sample_seed: 1337
  sample_greedy: false
  seed: 2027
