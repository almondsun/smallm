data:
  input_path: data/raw/input.txt
  tokenizer_path: data/processed/tokenizer.json
  block_size: 128
  train_split: 0.9

model:
  vocab_size: 256
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1

train:
  batch_size: 32
  max_steps: 1000
  learning_rate: 0.0003
  eval_interval: 100
  checkpoint_dir: checkpoints
  seed: 1337
