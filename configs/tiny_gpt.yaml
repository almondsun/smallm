data:
  input_path: data/raw/input.txt
  prepared_path: data/processed/corpus.txt
  tokenizer_path: data/processed/tokenizer.json
  block_size: 64
  train_split: 0.9

model:
  vocab_size: 256
  block_size: 64
  n_layer: 2
  n_head: 2
  n_embd: 64
  dropout: 0.1

train:
  run_name: tiny_gpt
  runs_dir: runs
  batch_size: 16
  max_steps: 500
  learning_rate: 0.0003
  log_interval: 10
  eval_interval: 50
  eval_batches: 5
  sample_prompt: Once
  sample_max_new_tokens: 100
  seed: 1337
