data:
  input_path: data/raw/input.txt
  tokenizer_path: data/processed/tokenizer.json
  block_size: 32
  train_split: 0.9

model:
  vocab_size: 256
  block_size: 32
  n_layer: 1
  n_head: 1
  n_embd: 32
  dropout: 0.1

train:
  batch_size: 4
  max_steps: 5
  learning_rate: 0.0003
  eval_interval: 100
  checkpoint_dir: checkpoints
  seed: 1337
